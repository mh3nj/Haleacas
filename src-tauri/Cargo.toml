[workspace]
members = ["crates/haleacas-core"]

[package]
name = "app"
version = "0.1.0"
description = "Haleacas — offline-first repository intelligence toolkit"
authors = ["Haleacas contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# domain logic lives in the framework-agnostic haleacas-core crate; this
# package only wires it up to Tauri IPC/state/tray (spec section 37).
haleacas-core = { path = "crates/haleacas-core" }
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1.0"
auto-launch = "0.5"
